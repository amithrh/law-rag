name: lawrag-prod

# Production overlay for Linux + NVIDIA hosts. Use with the base file:
#
#   docker compose \
#     --env-file ../.env \
#     -f docker-compose.yml -f docker-compose.prod.yml \
#     up -d
#
# Differences from Mac-dev base (docker-compose.yml):
#   - TEI service enabled (CUDA image, bge-m3 on GPU; replaces host-side
#     sentence-transformers MPS worker)
#   - Ollama gets NVIDIA GPU passthrough
#   - api + web services run inside the docker network (talking to
#     postgres / redis / ollama via service names, not localhost)
#   - prometheus + grafana for observability
#   - Larger Postgres shared_buffers / work_mem for the production workload
#
# Required env vars beyond the base .env:
#   API_IMAGE                  the prebuilt API container image tag
#   WEB_IMAGE                  the prebuilt Next.js image tag
#   GRAFANA_ADMIN_PASSWORD     for the Grafana web UI
#
# Pre-flight: make sure nvidia-container-toolkit is installed on the host
# and `docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi`
# works before bringing the stack up.

services:
  postgres:
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_connections=200"

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # TEI — text-embeddings-inference on CUDA. Replaces the host-side
  # sentence-transformers worker used on Mac.
  tei:
    image: ${TEI_IMAGE_CUDA:-ghcr.io/huggingface/text-embeddings-inference:89-1.5}
    container_name: lawrag-tei
    ports:
      - "${TEI_HOST_PORT:-8080}:80"
    volumes:
      - tei-cache:/data
    environment:
      MODEL_ID: ${TEI_MODEL_ID:-BAAI/bge-m3}
      MAX_BATCH_TOKENS: ${TEI_MAX_BATCH_TOKENS:-16384}
      HF_HOME: /data
    command:
      - "--model-id"
      - "${TEI_MODEL_ID:-BAAI/bge-m3}"
      - "--port"
      - "80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    container_name: lawrag-api
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      EMBEDDING_BACKEND: tei
      TEI_HOST: tei
      TEI_PORT: "80"
      API_IN_DOCKER: "1"
      OLLAMA_API_HOST: ollama
      OLLAMA_HOST_PORT: "11434"
      OLLAMA_HOST: ollama
      OLLAMA_PORT: "11434"
      LLM_MODEL: ${LLM_MODEL}
      PREWARM_MODELS_ON_STARTUP: "true"
      PREWARM_MODELS_REQUIRED: "true"
      REQUIRE_PROVENANCE_VERIFIED: "true"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      tei:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    container_name: lawrag-web
    environment:
      API_INTERNAL_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: lawrag-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: lawrag-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  tei-cache:
  prometheus-data:
  grafana-data:
