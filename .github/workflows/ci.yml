name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install API test dependencies
        run: uv sync --extra dev --frozen
      - name: Check lockfile
        run: uv lock --check
      - name: Verify packaged authority manifests
        run: |
          uv build --wheel --offline --out-dir /tmp/law-rag-wheel
          PYTHONPATH= uv run python scripts/check_authority_registry_wheel.py /tmp/law-rag-wheel/*.whl
      - name: Compile serving code
        run: PYTHONPATH=. uv run python -m compileall -q apps/api scripts
      - name: Deterministic API regression suite
        run: >-
          PYTHONPATH=. uv run pytest apps/api/tests
          -m "not needs_stack and not needs_models and not needs_eval_data"
          --durations=20 -q
      - name: Start Docker-backed Postgres schema
        run: >-
          docker compose --env-file .env.example
          -f infra/docker-compose.yml
          up -d --wait postgres
      - name: Seed deterministic smoke corpus
        run: >-
          docker compose --env-file .env.example
          -f infra/docker-compose.yml
          exec -T postgres psql -U lawrag -d lawrag
          -f /dev/stdin < infra/postgres/ci-seed.sql
      - name: Verify authority migration against real Postgres
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_HOST_PORT: "5433"
          POSTGRES_DB: lawrag
          POSTGRES_USER: lawrag
          POSTGRES_PASSWORD: change-me-locally
        run: >-
          PYTHONPATH=. uv run pytest
          apps/api/tests/test_authority_migration_stack.py -q
      - name: Smoke test API startup and database health
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_HOST_PORT: "5433"
          POSTGRES_DB: lawrag
          POSTGRES_USER: lawrag
          POSTGRES_PASSWORD: change-me-locally
          PREWARM_MODELS_ON_STARTUP: "false"
        run: |
          set -euo pipefail
          PYTHONPATH=. uv run uvicorn apps.api.main:app \
            --host 127.0.0.1 --port 8056 >/tmp/law-rag-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8056/healthz >/tmp/law-rag-health.json; then
              python - <<'PY'
          import json

          with open("/tmp/law-rag-health.json", encoding="utf-8") as handle:
              health = json.load(handle)
          assert health["status"] == "ok", health
          assert health["chunks"] == 1, health
          assert health["documents"] == 1, health
          PY
              exit 0
            fi
            sleep 2
          done
          cat /tmp/law-rag-api.log
          exit 1
      - name: Show Docker logs on failure
        if: failure()
        run: >-
          docker compose --env-file .env.example
          -f infra/docker-compose.yml
          logs postgres

  compose:
    name: Production compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged production compose configuration
        env:
          API_IMAGE: law-rag-api:ci
          ANSWER_API_KEY: ci-compose-contract-only
          WEB_IMAGE: law-rag-web:ci
          GRAFANA_ADMIN_PASSWORD: ci-only
        run: >-
          docker compose --env-file .env.example
          -f infra/docker-compose.yml
          -f infra/docker-compose.prod.yml
          config --quiet
      - name: Assert production provenance gate
        env:
          API_IMAGE: law-rag-api:ci
          ANSWER_API_KEY: ci-compose-contract-only
          WEB_IMAGE: law-rag-web:ci
          GRAFANA_ADMIN_PASSWORD: ci-only
        run: |
          docker compose --env-file .env.example \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.prod.yml \
            config --format json > /tmp/law-rag-prod-compose.json
          python -c 'import json; c=json.load(open("/tmp/law-rag-prod-compose.json")); assert str(c["services"]["api"]["environment"]["REQUIRE_PROVENANCE_VERIFIED"]).lower() == "true"'

  web:
    name: Web type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
